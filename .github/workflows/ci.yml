# Motion X Ray — Continuous Integration.
# CI uses fixtures only and makes NO paid provider calls (no network to Nebius
# Token Factory or Tavily). No provider credentials are injected here; the live
# smoke scripts are NEVER run with --live in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (lint, type-check, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline lint, types, unit, contract and integration checks
        run: ./scripts/test.sh python

  web:
    name: web (type-check and production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline type-check and production build
        run: ./scripts/test.sh web

      - name: Generated contract drift
        run: |
          ./scripts/export-contracts.sh
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/schemas apps/web/generated/api.d.ts
