[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motion-xray-scoring"
version = "0.1.0"
description = "Motion X Ray — deterministic scoring (normalize/align, DTW, per-rep and per-set scores)."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.2",
    "motion-xray-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["scoring"]
