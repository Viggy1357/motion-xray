[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "motion-xray-api"
version = "0.1.0"
description = "Motion X Ray — FastAPI service exposing /healthz and the /v1 surface (STRUCTURE-ONLY: routes are 501 placeholders until the owning tasks land)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.9.2",
    "uvicorn==0.31.0",
    "motion-xray-contracts==0.2.0",
    "motion-xray-providers==0.1.0",
    "motion-xray-benchmarks==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
