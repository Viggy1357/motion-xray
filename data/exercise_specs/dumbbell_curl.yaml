# Motion X Ray — exercise spec: standing dumbbell curl.
# Declarative scoring configuration consumed by movement + scoring (STRUCTURE-ONLY).
# The 'weights' map MUST sum to exactly 1.0. Segmentation thresholds are on the
# normalised phase signal; 'missing_required_metric: null_overall_score' enforces
# the no-fabrication rule — a missing required metric nulls the overall score with
# a machine-readable reason rather than inventing a value (AGENTS.md).
exercise_id: dumbbell_curl
variant: standing_both_arms
spec_version: 0.1.0
scoring_profile_id: dumbbell_curl.default
supported_view: side
required_capabilities:
  - estimated_3d
  - timestamps
phase_signal: elbow_flexion_angle
segmentation:
  low: 0.2
  high: 0.8
  dwell_s: 0.15
metric_rules_from: dumbbell_curl.default
weights:
  elbow_rom: 0.25
  upper_arm_drift: 0.25
  torso_sway: 0.20
  phase_tempo: 0.15
  trajectory_error: 0.15
missing_required_metric: null_overall_score
